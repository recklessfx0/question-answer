name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate backlog
        run: python3 tools/validate_backlog.py
      - name: Validate Spec Kit tasks
        run: python3 tools/validate_specs.py
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
      - name: Validate Composer manifest
        run: |
          set -euo pipefail
          composer validate --strict
          if [ -f composer.lock ]; then
            composer audit --locked
          else
            echo "No composer.lock yet; audit runs once dependencies are locked."
          fi
